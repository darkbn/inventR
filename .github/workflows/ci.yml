name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  api:
    name: API — lint, tests, démarrage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: inventair
          POSTGRES_PASSWORD: inventair
          POSTGRES_DB: inventair
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U inventair"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://inventair:inventair@localhost:5432/inventair?schema=inventory
      JWT_ACCESS_SECRET: secret-de-ci-uniquement-au-moins-32-caracteres
      JWT_REFRESH_SECRET: autre-secret-de-ci-au-moins-32-caracteres-aussi
      CORS_ORIGINS: http://localhost:5273
      SEED_ADMIN_EMAIL: admin@inventair.local
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: MotDePasseDeCI12345
      LOG_LEVEL: warn
      LOG_PRETTY: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrations
        run: pnpm db:deploy

      - name: Seed
        run: pnpm db:seed

      - name: Lint
        run: pnpm --filter @inventair/api lint

      - name: Compilation
        run: pnpm --filter @inventair/api build

      - name: Tests unitaires
        run: pnpm --filter @inventair/api test

      - name: Tests d'intégration
        run: pnpm --filter @inventair/api test:e2e

      # Les tests montent l'application via le module de test de Nest, dont la
      # résolution de modules diffère de celle de Node : une dépendance
      # transitive non déclarée n'y apparaît pas. Ce démarrage réel la révèle.
      - name: Démarrage du binaire compilé
        run: pnpm api:smoke

  # ---------------------------------------------------------------------------
  web:
    name: Web — lint, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 11 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @inventair/web lint

      - name: Vérification des types
        run: pnpm --filter @inventair/web exec tsc --noEmit -p tsconfig.app.json

      - name: Tests
        run: pnpm --filter @inventair/web test

      - name: Compilation
        run: pnpm --filter @inventair/web build

  # ---------------------------------------------------------------------------
  mobile:
    name: Android — analyse, tests, APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # Le plugin Gradle de Flutter impose une version de NDK précise, et son
      # installation automatique est peu fiable. On la rend explicite plutôt
      # que de laisser la compilation échouer au bout de plusieurs minutes.
      - name: NDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"

      - run: flutter pub get

      - name: Génération du code Drift
        run: dart run build_runner build

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

      # Le magasin de clés est stocké en secret, encodé en base64. Sans lui —
      # sur une contribution externe, par exemple — la compilation retombe sur
      # la clé de debug et produit tout de même un APK installable.
      - name: Restauration du magasin de clés
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/keystore/inventair-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../keystore/inventair-release.jks
          EOF

      - name: Compilation de l'APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://192.168.1.100:3000/api/v1' }}

      - uses: actions/upload-artifact@v4
        with:
          name: inventair-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ---------------------------------------------------------------------------
  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [api, web]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image de l'API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          push: false
          tags: inventair-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Image du frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: production
          push: false
          tags: inventair-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Une surcouche de production invalide ne se découvre qu'au déploiement :
      # autant la valider à chaque pousse.
      - name: Validation de la composition de production
        env:
          PUBLIC_DOMAIN: inventair.exemple.dz
          POSTGRES_USER: inventair
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: inventair
        run: |
          touch .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
