# ------------------------------------------------------------------------------
# Serveur statique du frontend, à l'intérieur du conteneur « web ».
# Il n'est jamais exposé directement : le reverse proxy est devant.
# ------------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les logs du proxy suffisent ; ceux-ci feraient doublon.
    access_log off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2;

    # Vite produit des noms de fichiers hachés : le contenu d'une URL donnée ne
    # change jamais, on peut donc la mettre en cache sans limite.
    location /assets/ {
        # Un seul en-tête : la directive « expires » en émettrait un second,
        # et deux Cache-Control concurrents sur la même réponse sont au mieux
        # ambigus.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html, lui, ne doit JAMAIS être mis en cache : c'est lui qui pointe
    # vers les actifs hachés. Un index périmé servirait des bundles disparus.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Application monopage : toute route inconnue est rendue par le routeur React.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
