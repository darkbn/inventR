# ------------------------------------------------------------------------------
# InventAir — environnement de DÉVELOPPEMENT
#
#   docker compose up -d                  → PostgreSQL seul (API/web lancés en local
#                                           avec hot-reload : pnpm api:dev / web:dev)
#   docker compose --profile tools up -d  → ajoute pgAdmin
#   docker compose --profile full up -d   → ajoute l'API conteneurisée
#
# La configuration de PRODUCTION est dans docker-compose.prod.yml.
# ------------------------------------------------------------------------------

name: inventair

services:
  postgres:
    image: postgres:17-alpine
    container_name: inventair-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Comparaisons de chaînes déterministes, indispensable aux index sur les codes articles
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=fr-DZ --encoding=UTF8'
      TZ: ${TZ:-Africa/Algiers}
    ports:
      # En développement uniquement : en production PostgreSQL n'est jamais exposé.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - inventair

  api:
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: inventair-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      # Depuis le réseau Docker, l'hôte de la base est "postgres", pas "localhost".
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=inventory
    env_file:
      - .env
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - ./apps/api/src:/app/apps/api/src:ro
      - ./apps/api/prisma:/app/apps/api/prisma:ro
      - uploads:/app/storage/uploads
      - reports:/app/storage/reports
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - inventair

  pgadmin:
    profiles: ['tools']
    image: dpage/pgadmin4:latest
    container_name: inventair-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_LISTEN_PORT: 80
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin:/var/lib/pgadmin
    networks:
      - inventair

volumes:
  pgdata:
  pgadmin:
  uploads:
  reports:

networks:
  inventair:
    driver: bridge
